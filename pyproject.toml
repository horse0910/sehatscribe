[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sehatscribe"
version = "0.1.0"
description = "Offline, multilingual AI clinical scribe for Snapdragon-powered PCs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Harsh Agrawal" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "python-multipart>=0.0.9",
  "cryptography>=42",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.0"]
npu = ["onnxruntime-qnn>=1.18", "onnxruntime-genai>=0.5"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
sehatscribe = "sehatscribe.cli:main"

[tool.setuptools.packages.find]
include = ["sehatscribe*"]

[tool.setuptools.package-data]
sehatscribe = ["web/*", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
# Pin the rule set so CI does not break when newer ruff releases change defaults.
select = ["E4", "E7", "E9", "F"]
